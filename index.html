<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グミ食べ隊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monomaniac+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="top">
        <h1>私が好きな最高なグミ紹介</h1>
    </div>
    <div id="about">
        <img src="alexas_fotos-giant-gummy-bear-1089612_1920.jpg">
        <p>
            私は「グミ大好き組」の一人、"愚魅宇魔"だ。
            <br>
            最近、コンビニで色んなグミをハシゴしているものだ。
        </p>
    </div>
    <div id="favorite">
        <p>私のお気に入りのグミたちはこの３つだ。</p>
        <ul>
            <li>ピュレグミ</li>
             <li>フェットチーネグミ</li>
              <li>ちいかわ　島へようこそ！！グミ</li>
        </ul>
        <div class="container">
            <div class="box">
                <img src="可愛い　ピュレグミ.jpg">
                パッケージが可愛く、さらに少し弾力があって甘酸っぱい。
            </div>
            <div class="box">
                <img src="フェットチーネグミイタリアングレープ味.jpg">
                周りの粉が甘酸っぱく、量が多いため、躊躇なくパクパク食べることができる。
            </div>
            <div class="box">
                <img src="ちいかわ　グミ　可愛い.jpg">
                とにかく可愛い。グミがちいかわのキャラの形をしており、もったいなくて食べれない。
            </div>
        
        </div>
    </div>
</body>
</html>
